name: Build and Deploy to GHCR + ArgoCD

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-polodev-blog
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/tim-polodev/polodev-blog

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/tim-polodev/polodev-blog
          build-args: |
            NEXT_PUBLIC_CMS_API_HOST=${{ vars.NEXT_PUBLIC_CMS_API_HOST }}
            NEXT_PUBLIC_GTM_ID=${{ vars.NEXT_PUBLIC_GTM_ID }}
            NEXT_WHITELIST_SOURCES=${{ vars.NEXT_WHITELIST_SOURCES }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout polodev-infra
        uses: actions/checkout@v4
        with:
          repository: tim-polodev/polodev-infra
          ssh-key: ${{ secrets.INFRA_DEPLOY_KEY }}
          path: infra

      - name: Update manifest image tag
        working-directory: infra
        run: |
          sed -i "s|image: .*|image: ${{ env.IMAGE_NAME }}:${{ github.sha }}|" k8s/apps/polodev-blog.yaml
          sed -i "s|imagePullPolicy: IfNotPresent|imagePullPolicy: Always|" k8s/apps/polodev-blog.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet k8s/apps/polodev-blog.yaml; then
            echo "No manifest changes to commit."
            exit 0
          fi
          git add k8s/apps/polodev-blog.yaml
          git commit -m "chore(polodev-blog): bump image to ${{ github.sha }}"
          git pull --rebase origin main
          git push origin HEAD:main
